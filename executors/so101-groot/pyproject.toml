[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
rojev = { path = "../../", editable = true }
gr00t = { git = "https://github.com/NVIDIA/Isaac-GR00T", rev = "9fbe86a" }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
tensorrt-cu12-libs = [{ index = "nvidia-pypi", marker = "sys_platform == 'linux'" }]

# The service imports only rojev's S1 side (protocol, robot, control, system1, transport); the S2 model clients'
# transformers >= 5 would clash with GR00T's 4.57.3. Same route as executors/robocasa-xr1.
[[tool.uv.dependency-metadata]]
name = "rojev"
version = "0.0.1"
requires-dist = ["aioquic>=1.7.0", "mujoco>=3.1.3,<4", "numpy", "pillow", "pyyaml"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }, "packaging", "psutil", "ninja", "wheel"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3"
requires-dist = ["torch", "einops"]
