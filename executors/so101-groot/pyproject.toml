# Executor environment for GR00T N1.7 fine-tuned for the SO-101, as a remote S1 service (decision 2026-11-07).
# The adapter (groot_io.py, serve.py's GrootPolicy) needs only the core and numpy, so the Mac env has just those and
# its tests run there; the model (Isaac-GR00T pinned by commit, with its torch 2.9.0 / transformers 4.57.3 /
# flash-attn 2.8.3 stack, flash-attn from Isaac-GR00T's own prebuilt-wheel source) installs only on Linux, i.e. on
# the GPU box by gpu_setup.sh's plain `uv sync --frozen`.
[project]
name = "rojev-executor-so101-groot"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "gr00t ; sys_platform == 'linux'",
    "huggingface-hub",
    "numpy",
    "pyyaml",
    "rojev",
    "torch==2.9.0 ; sys_platform == 'linux'",
    "torchvision==0.24.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Isaac-GR00T sources torchcodec for linux/aarch64 from a Git-LFS file in its repo (a pointer, not a wheel, in a git
# checkout); only macOS arm64 (tests) and linux x86_64 (the box) are resolved here, where PyPI's torchcodec serves.
# Isaac-GR00T also sources flash-attn from the prebuilt wheel URL, whose file name carries a local version
# (+cu12torch2.9cxx11abiTRUE) that its metadata lacks, so `uv sync --frozen --check` never passes (gpu_setup's
# readiness check): the override takes flash-attn from its PyPI sdist instead, built with the CUDA compile skipped so
# its setup.py fetches that same prebuilt wheel under a matching name (as executors/robocasa-xr1 does).
[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "flash-attn==2.8.3 ; sys_platform == 'linux'",
    "torchcodec==0.8.0 ; platform_machine == 'x86_64'",
]
constraint-dependencies = [
