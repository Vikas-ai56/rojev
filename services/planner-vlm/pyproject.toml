[project]
name = "rojev-service-planner-vlm"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub>=0.34,<1",
    "pillow>=10",
    "pyyaml>=6",
    "qwen-vl-utils==0.0.14 ; sys_platform == 'linux'",
    "transformers>=4.57,<4.58 ; sys_platform == 'linux'",
    "vllm==0.18.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
