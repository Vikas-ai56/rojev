# Generic S1 service for LeRobot-format policy checkpoints (first: NVIDIA's GR00T N1.7 LIBERO checkpoints), selected by
# a model config in config/s1/. LeRobot 0.6.1 with its groot extra (the version the LIBERO checkpoints were trained
# with) installs only on Linux, i.e. on the GPU box; the Mac env holds only the adapter's needs (core S1 side, numpy,
# pyyaml) and huggingface-hub for the hook's Mac-side login check, so the tests run there with a stand-in policy.
# torch / torchvision come from PyTorch's CUDA 12.8 index on Linux, as in the other services. rojev's dependency
# metadata is narrowed to its S1 side (protocol, robot, control, system1, transport), as in executors/so101-groot:
# the service needs neither OneJev's client nor tracing. decord (in the groot extra, for decoding training videos) is
# left out: inference never imports it, and its only wheel declares a cp36 tag, so uv would reinstall it on every
# sync and `uv sync --frozen --check` (gpu_setup's readiness check) would never pass.
[project]
name = "rojev-service-lerobot-policy"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub",
    "lerobot[groot]==0.6.1 ; sys_platform == 'linux'",
    "numpy",
    "pyyaml",
    "rojev",
    "torch ; sys_platform == 'linux'",
    "torchvision ; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = ["decord ; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
rojev = { path = "../../", editable = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.dependency-metadata]]
name = "rojev"
version = "0.0.1"
requires-dist = ["aioquic>=1.7.0", "mujoco>=3.1.3,<4", "numpy", "pillow", "pyyaml"]
