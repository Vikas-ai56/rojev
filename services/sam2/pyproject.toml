# SAM 2.1 object-mask service (cloud GPU). Own env: transformers' SAM 2 port, independent of the MJev and π0.5² pins.
[project]
name = "rojev-service-sam2"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub>=1.5,<2",
    "numpy>=1.26,<3",
    "pillow>=10",
    "torch>=2.9,<2.10",
    "torchvision>=0.24,<0.25",
    "transformers>=5,<6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
